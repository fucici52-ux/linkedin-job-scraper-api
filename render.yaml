services:
  - type: web
    name: linkedin-job-scraper-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir src job_scraper.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SCRAPER_MAX_RESULTS
        value: 25
      - key: SCRAPER_REQUEST_DELAY_SECONDS
        value: 1
      - key: SCRAPER_REQUEST_TIMEOUT_SECONDS
        value: 20
      - key: SCRAPER_SOURCE_TIMEOUT_SECONDS
        value: 12
      - key: SCRAPER_ATS_TIMEOUT_SECONDS
        value: 18
      - key: SCRAPER_SOURCE_ATTEMPTS
        value: 2
      - key: SCRAPER_SOURCE_CONCURRENCY
        value: 12
      - key: SCRAPER_ENABLE_ATS_DATASET
        value: false
